<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinancePulse - Modern Expense Tracker</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="header-container">
            <div class="brand-box">
                <div class="brand-icon"><i class="fa-solid fa-wallet"></i></div>
                <div>
                    <h1 class="brand-title">FinancePulse</h1>
                    <p class="brand-subtitle">Smart Personal Tracker</p>
                </div>
            </div>

            <!-- Header Action Buttons -->
            <div class="header-actions">
                <button id="export-btn" class="btn-header">
                    <i class="fa-solid fa-download"></i> <span>Export CSV</span>
                </button>
                <button id="theme-toggle" class="btn-header">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">

        <!-- Top Summary Cards -->
        <div class="summary-grid">
            <div class="card summary-card">
                <div>
                    <span class="summary-title">Total Balance</span>
                    <h2 id="balance-amount" class="summary-value">$0.00</h2>
                </div>
                <div class="summary-icon-box bg-blue"><i class="fa-solid fa-scale-balanced"></i></div>
            </div>

            <div class="card summary-card">
                <div>
                    <span class="summary-title">Total Income</span>
                    <h2 id="income-amount" class="summary-value text-emerald">+$0.00</h2>
                </div>
                <div class="summary-icon-box bg-emerald"><i class="fa-solid fa-arrow-trend-up"></i></div>
            </div>

            <div class="card summary-card">
                <div>
                    <span class="summary-title">Total Expenses</span>
                    <h2 id="expense-amount" class="summary-value text-rose">-$0.00</h2>
                </div>
                <div class="summary-icon-box bg-rose"><i class="fa-solid fa-arrow-trend-down"></i></div>
            </div>
        </div>

        <!-- Dashboard Layout: Add Form + Chart -->
        <div class="dashboard-grid">
            
            <!-- Left Side: Add Transaction Form -->
            <div class="card">
                <h3 class="form-title"><i class="fa-solid fa-circle-plus text-emerald"></i> Add Transaction</h3>
                
                <form id="transaction-form">
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="tx-type" value="income" checked>
                            <span class="radio-custom">Income</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="tx-type" value="expense">
                            <span class="radio-custom">Expense</span>
                        </label>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="tx-title">Title / Description</label>
                        <input type="text" id="tx-title" class="input-control" placeholder="e.g. Salary, Grocery..." required>
                        <span id="title-error" class="validation-err hidden">Please enter a valid title</span>
                    </div>

                    <div class="form-double-row">
                        <div class="input-group">
                            <label class="input-label" for="tx-amount">Amount ($)</label>
                            <input type="number" step="0.01" id="tx-amount" class="input-control" placeholder="0.00" required>
                            <span id="amount-error" class="validation-err hidden">Enter valid amount</span>
                        </div>

                        <div class="input-group">
                            <label class="input-label" for="tx-date">Date</label>
                            <input type="date" id="tx-date" class="input-control" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="tx-category">Category</label>
                        <select id="tx-category" class="input-control"></select>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-plus"></i> Save Transaction
                    </button>
                </form>
            </div>

            <!-- Right Side: Expense Doughnut Chart -->
            <div class="card chart-card">
                <h3 class="form-title"><i class="fa-solid fa-chart-pie text-blue"></i> Expense Breakdown</h3>
                <div class="chart-wrapper">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

        </div>

        <!-- Transactions History & Filters -->
        <div class="card">
            <div class="history-header">
                <h3 class="form-title title-no-margin"><i class="fa-solid fa-list text-emerald"></i> Recent Transactions</h3>
                
                <div class="filter-bar">
                    <div class="search-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="search-tx" class="input-control search-input" placeholder="Search title or category...">
                    </div>

                    <select id="filter-type" class="input-control select-auto-width">
                        <option value="all">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>

                    <select id="filter-category" class="input-control select-auto-width">
                        <option value="all">All Categories</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th class="text-right">Amount</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list">
                        <!-- Dynamic Rows Here -->
                    </tbody>
                </table>

                <div id="empty-state" class="empty-state-box hidden">
                    <i class="fa-solid fa-folder-open empty-state-icon"></i>
                    <p>No transactions found.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay hidden">
        <div class="card modal-card">
            <div class="modal-header">
                <h3>Edit Transaction</h3>
                <button id="close-modal" class="modal-close">&times;</button>
            </div>

            <form id="edit-form">
                <input type="hidden" id="edit-id">
                
                <div class="input-group">
                    <label class="input-label" for="edit-title">Title</label>
                    <input type="text" id="edit-title" class="input-control" required>
                </div>

                <div class="form-double-row">
                    <div class="input-group">
                        <label class="input-label" for="edit-amount">Amount</label>
                        <input type="number" step="0.01" id="edit-amount" class="input-control" required>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="edit-date">Date</label>
                        <input type="date" id="edit-date" class="input-control" required>
                    </div>
                </div>

                <div class="form-double-row">
                    <div class="input-group">
                        <label class="input-label" for="edit-type">Type</label>
                        <select id="edit-type" class="input-control">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="edit-category">Category</label>
                        <select id="edit-category" class="input-control"></select>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancel-edit" class="btn-header modal-btn">Cancel</button>
                    <button type="submit" class="btn-submit modal-btn">Update</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- JS Script Link -->
    <script src="script.js"></script>
</body>
</html>
